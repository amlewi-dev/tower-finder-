<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tower Finder - Admin review</title>
<style>
  :root { --bg:#09090b; --card:#18181b; --border:#27272a; --fg:#fafafa; --muted:#a1a1aa; --green:#22c55e; --red:#ef4444; --amber:#f59e0b; }
  * { box-sizing: border-box; }
  body { margin:0; font-family: system-ui, sans-serif; background:var(--bg); color:var(--fg); }
  header { display:flex; gap:12px; align-items:center; padding:16px 20px; border-bottom:1px solid var(--border); position:sticky; top:0; background:var(--bg); z-index:2; flex-wrap:wrap; }
  h1 { font-size:18px; margin:0; margin-right:auto; }
  button, select { background:var(--card); color:var(--fg); border:1px solid var(--border); border-radius:8px; padding:8px 14px; font-size:14px; cursor:pointer; }
  button.ok { background:var(--green); color:#052e16; border-color:var(--green); font-weight:600; }
  button.no { background:var(--red); color:#fff; border-color:var(--red); font-weight:600; }
  main { display:grid; grid-template-columns:repeat(auto-fill,minmax(320px,1fr)); gap:16px; padding:20px; }
  .card { background:var(--card); border:1px solid var(--border); border-radius:14px; overflow:hidden; }
  .card img { width:100%; height:240px; object-fit:cover; display:block; background:#000; }
  .body { padding:14px; display:grid; gap:8px; font-size:14px; }
  .row { display:flex; gap:8px; flex-wrap:wrap; align-items:center; }
  .muted { color:var(--muted); }
  .chip { font-size:12px; padding:2px 8px; border-radius:999px; border:1px solid var(--border); }
  .chip.good { color:var(--green); border-color:var(--green); }
  .chip.warn { color:var(--amber); border-color:var(--amber); }
  a { color:#60a5fa; }
  #msg { padding:20px; color:var(--muted); }
</style>
</head>
<body>
<header>
  <h1>Tower submissions</h1>
  <select id="status">
    <option value="pending">Pending</option>
    <option value="approved">Approved</option>
    <option value="rejected">Rejected</option>
  </select>
  <button id="refresh">Refresh</button>
  <button id="logout">Change token</button>
</header>
<div id="msg"></div>
<main id="list"></main>
<script>
  const $ = (id) => document.getElementById(id);
  let token = sessionStorage.getItem("admin_token") || "";

  function ensureToken() {
    if (!token) {
      token = prompt("Admin token (ADMIN_TOKEN from the server):") || "";
      sessionStorage.setItem("admin_token", token);
    }
  }

  async function api(path, opts = {}) {
    const res = await fetch(path, { ...opts, headers: { Authorization: "Bearer " + token } });
    if (res.status === 401) {
      sessionStorage.removeItem("admin_token");
      token = "";
      throw new Error("Bad admin token. Click Change token.");
    }
    if (!res.ok) throw new Error(await res.text());
    return res.json();
  }

  function esc(s) {
    return String(s).replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
  }

  async function load() {
    ensureToken();
    const status = $("status").value;
    $("msg").textContent = "Loading...";
    $("list").innerHTML = "";
    try {
      const items = await api("/api/admin/submissions?status=" + status);
      $("msg").textContent = items.length ? "" : "Nothing here.";
      $("list").innerHTML = items.map((s) => {
        const flags = s.flags.map((f) => '<span class="chip good">' + esc(f.replaceAll("_", " ")) + "</span>").join("");
        const accClass = s.accuracy <= 20 ? "good" : "warn";
        const osm = "https://www.openstreetmap.org/?mlat=" + s.lat + "&mlon=" + s.lon + "#map=18/" + s.lat + "/" + s.lon;
        const buttons = status === "pending"
          ? '<div class="row"><button class="ok" data-act="approve" data-id="' + s.id + '">Approve</button><button class="no" data-act="reject" data-id="' + s.id + '">Reject</button></div>'
          : "";
        return '<div class="card"><a href="' + esc(s.photo) + '" target="_blank"><img src="' + esc(s.photo) + '" loading="lazy"></a><div class="body">'
          + '<div class="row"><b>#' + s.id + "</b><span class=\"chip\">" + esc(s.operator) + '</span><span class="chip ' + accClass + '">GPS ' + Math.round(s.accuracy) + " m</span>" + flags + "</div>"
          + "<div>" + s.lat.toFixed(5) + ", " + s.lon.toFixed(5) + ' - <a href="' + osm + '" target="_blank">open in OSM</a></div>'
          + (s.note ? "<div>" + esc(s.note) + "</div>" : "")
          + '<div class="muted">' + new Date(s.created_at * 1000).toLocaleString() + "</div>"
          + buttons + "</div></div>";
      }).join("");
    } catch (e) {
      $("msg").textContent = e.message;
    }
  }

  $("list").addEventListener("click", async (e) => {
    const b = e.target.closest("button[data-act]");
    if (!b) return;
    b.disabled = true;
    try {
      await api("/api/admin/submissions/" + b.dataset.id + "/" + b.dataset.act, { method: "POST" });
      b.closest(".card").remove();
    } catch (err) {
      alert(err.message);
      b.disabled = false;
    }
  });
  $("status").addEventListener("change", load);
  $("refresh").addEventListener("click", load);
  $("logout").addEventListener("click", () => { sessionStorage.removeItem("admin_token"); token = ""; load(); });
  load();
</script>
</body>
</html>
